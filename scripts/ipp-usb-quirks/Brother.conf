# ipp-usb quirk for the Brother QL-820NWB(c) — HANDS OFF THIS PRINTER.
#
# Why: ipp-usb's USB session goes stale after a few minutes. Symptoms are
# `0 bytes` on every request, a blank web page at localhost:60000, and print
# jobs that hang at "now printing" — all while the printer sits there lit and
# READY. `systemctl restart ipp-usb` revives it instantly without touching the
# printer, which is how we proved the daemon was at fault, not the hardware.
#
# Blacklisting it here stops ipp-usb claiming the device at all, which frees
# CUPS's own `usb://` backend to drive it with the real ptouch driver
# (printer-driver-ptouch — the QL-820NWB is explicitly supported, and marked
# "recommended"). That takes ipp-usb out of the chain entirely: no daemon, no
# stale sessions, no restarts, no network needed.
#
# TRADE-OFF: you also lose the printer's web UI at http://localhost:60000/,
# because that page was only ever ipp-usb forwarding it over the USB cable. To
# get it back, comment out the blacklist line and restart ipp-usb — or reach
# the printer's web UI over the network if you've put it on Wi-Fi/Ethernet.
#
# Install:
#   sudo cp scripts/ipp-usb-quirks/Brother.conf /usr/share/ipp-usb/quirks/
#   sudo systemctl restart ipp-usb

[Brother QL-820NWB*]
  blacklist = true
