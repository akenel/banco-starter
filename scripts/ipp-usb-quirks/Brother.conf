# ipp-usb quirk for the Brother QL-820NWB(c)
#
# Symptom this targets: ipp-usb serves the printer fine for a few minutes,
# then its USB session goes stale -- HTTP requests return 0 bytes and print
# jobs hang forever -- while the printer itself is still awake and READY.
# `systemctl restart ipp-usb` fixes it instantly without touching the printer.
#
# `http-connection = close` stops ipp-usb reusing a persistent connection to
# the device, so every request opens a fresh one. Costs a little latency;
# avoids the stale-keepalive hang.
#
# Install:  sudo cp Brother.conf /usr/share/ipp-usb/quirks/Brother.conf
#           sudo systemctl restart ipp-usb

[Brother QL-820NWB*]
  http-connection = close
  init-reset = soft
