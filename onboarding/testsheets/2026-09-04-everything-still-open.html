<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">

<script>
const SHEET = {
  key:      'banco-uat-2026-09-04-everything-outstanding-v1',
  eyebrow:  'Banco POS · UAT · TRIAGE',
  title:    'Everything still open',
  standfirst: '<b>Read this bit first, because the marks mean something different on this sheet.</b> These are <i>known problems</i>, not finished work. So: <b>PASS = the problem is gone.</b> <b>FAIL = still exactly as described.</b> <b>ISSUE = still there but different, or only partly.</b> Several of these may already have healed as side effects of today\'s nine fixes — <b>1.1 looks like it has</b>, and I could not reproduce it — but "probably fixed by something else" is precisely the claim I got wrong about the login screen this morning, so nothing comes off the list until a person looks. Section C is the one thing nothing has ever tested: all nine of today\'s fixes in one continuous sale.',
  meta: [['Shop','banco.wolfhold.app','https://banco.wolfhold.app/pos'], ['Log in as','felix or layla'],
         ['Build','b607 · 79a031a'], ['Deployed','4 Sep 2026, 16:55'], ['Device','the shop tablet, LANDSCAPE'], ['Budget','~25 min']],
  safety: { title: 'Never press the payment button.',
            body: 'Every step here stops short of completing a sale. Opening Checkout to look is fine and section C asks you to. A completed transaction is a line in the Kassenbuch and cannot be taken back out. Baskets end with 🗑️ Clear; any test row is named <b>ZZTEST</b>.' },

  sections: [

    { id: 'A', title: 'The five that block a shift', time: '9 min', steps: [
      { id: 'A1',
        do: '<b>1.1 — the clipped total.</b> Scan five things and look at the money row, then scroll right to the bottom of the cart.',
        expect: '<b>PASS if the total and Checkout are never cut off</b> by the bottom tab bar',
        callout: 'Almost certainly gone — your own layout change put the total at the top, which makes this impossible rather than fixed. I measured 1, 2, 3, 5 and 8 lines and could not reproduce it on the current build. Confirm it and it comes off the list for real.' },
      { id: 'A2',
        do: '<b>1.2 — mm/dd dates.</b> Open <b>Transactions</b> and read the <b>From:</b> and <b>To:</b> filter boxes, then the "Showing …" line just below them.',
        expect: '<b>FAIL is expected here.</b> The filters still say <span class="mono">09/04/2026</span> while the line below says <span class="mono">04.09.2026</span>',
        callout: 'Layla found this one. Still open, and the fix needs a small Banco calendar — the browser\'s own picker takes its format from the browser\'s locale and nothing on the page can change it. Six fields: Transactions ×2, Product Sales ×2, Audit ×2.' },
      { id: 'A3',
        do: '<b>1.3 — the keyboard buries the results.</b> Go to <b>🔍 Search</b>, type <span class="mono">cbd</span>, and without dismissing the pad, count how many result rows you can actually see.',
        expect: '<b>FAIL if you have to dismiss the pad</b> to read what you searched for',
        why: 'On 3 September this showed "Showing 20 of 366 matches" and one and a half rows. The pad is ~350px tall on a 895px screen.' },
      { id: 'A4',
        do: '<b>1.4 — the discount chips.</b> Build a basket, go to <b>Checkout</b>, use <b>Target Total</b> to set a round number, then look at the <span class="mono">None / 5% / 10% / 15% / Custom</span> chips. Read the "max discount" wording too. <b>Do not complete the sale.</b>',
        expect: '<b>FAIL if none of the chips is highlighted</b> after Target Total has applied a discount',
        callout: 'Two problems in one place: the chips do not reflect a discount that IS applied, and "Your max discount: 100%" is developer copy on a cashier\'s screen. A cashier cannot tell what the customer is being charged.' },
      { id: 'A5',
        do: '<b>1.5 — the half-cut row.</b> On <b>🔍 Search</b>, scroll the left-hand product list to the bottom.',
        expect: '<b>FAIL if the last row is sliced through the middle</b>',
        why: 'A fixed max-height that does not stop on a row boundary. Small, constant, and it makes every pack look like it is missing something.' },
    ]},

    { id: 'B', title: 'The six she will ask about', time: '7 min', steps: [
      { id: 'B1',
        do: '<b>2.1 — Keycloak role names.</b> Look at the top-right of <b>Transactions</b> or the dashboard.',
        expect: '<b>FAIL if you can see</b> <span class="mono">default-roles-kc-pos-realm-dev-1, pos-cashier, pos-manager</span>',
        why: 'It was on Layla\'s screen this afternoon. It reads as something broken to anyone who does not know what Keycloak is.' },
      { id: 'B2',
        do: '<b>2.2 — the login toast.</b> Log out and back in, and watch the green <b>"Login successful!"</b> message.',
        expect: '<b>FAIL if it lands on top of the user chip</b> it sits beside' },
      { id: 'B3',
        do: '<b>2.3 — Cleanup Queue.</b> Open <b>Cleanup</b> and read the row titles.',
        expect: '<b>FAIL if words are cut mid-word</b> — "quick-added prod…", "5395 products to finis"' },
      { id: 'B4',
        do: '<b>2.4 — Order Book dropdown.</b> Start a new Order Book line, pick an item from the suggestions, then look just under the box.',
        expect: '<b>FAIL if the suggestion list is still open</b>, covering "✓ linked to catalog" and the Qty label',
        why: 'Felix found this one this morning; it was the residual he described.' },
      { id: 'B5',
        do: '<b>2.5 — the silent bad time.</b> My Day → put <span class="mono">2530</span> in Start time and look <b>only at the box</b>, not down the page.',
        expect: 'The box goes red and says why — <b>PASS if you can tell without scrolling</b>',
        callout: 'This one I believe is already fixed, this morning. It is on the sheet because I believed that about the login screen too and was wrong.' },
      { id: 'B6',
        do: '<b>2.6 — the KB with no door.</b> Try to reach the knowledge-base approvals screen by tapping only — no typing a URL.',
        expect: '<b>FAIL if you cannot get there</b>',
        callout: 'Layla asked where the KB is. The honest answer is that <span class="mono">/pos/kb-approvals</span> exists as a page and is linked from no screen in the POS. A whole feature with no entry point.' },
    ]},

    { id: 'C', title: 'One whole sale, with everything from today in it', time: '7 min', steps: [
      { id: 'C1',
        do: 'From a clean cart: scan <b>three OCB Black Slim Rolls</b> so the pack deal fires, then <b>one CBD joint</b>, then <b>re-scan the OCB</b> a fourth time.',
        codes: ['30062092'],
        expect: 'The ring lands back on the <b>OCB line</b> when you re-scan it, the quantity goes to 4, and the total at the top follows every scan',
        callout: 'This is the single most important step on the sheet. Nothing has ever tested today\'s nine fixes together in one flow — each was proved on its own, on a fresh screen, by a person who knew what to look for.' },
      { id: 'C2',
        do: 'Set a <b>10% discount</b> at the bottom of the cart, then look back at the top without scrolling.',
        expect: 'The pinned TOTAL has already changed, and a <b>Subtotal</b> line has appeared beside it' },
      { id: 'C3',
        do: 'Press <b>Checkout</b>. Read the total, the VAT line, and pick a payment tile. <b>Do not press the payment button.</b>',
        expect: 'Same total as the cart · the VAT line agrees · the tile you picked is <b>readable</b> when selected',
        why: 'Three separate fixes from this week meeting on one screen: the pooled-VAT fix, the cart/checkout agreement, and the chosen-tile contrast.' },
      { id: 'C4',
        do: 'Go back, and scan something <b>age-restricted</b>. Enter a birthdate on the 18+ gate using <b>only the on-screen keypad</b> — no folio keyboard.',
        expect: 'All eight digits go in, <span class="mono">dd.mm.yyyy</span>, and the gate accepts it',
        callout: 'The compliance one. Four of today\'s fixes stack up in this single box: the date order, the pad accepting all eight digits, the plausibility check, and the refusal that greys the button.' },
      { id: 'C5',
        do: '🗑️ Clear. Then say in one sentence how the whole flow felt compared with this morning.',
        expect: 'Your words, not a checkbox' },
    ]},

    { id: 'D', title: 'Put the shop back', time: '1 min', steps: [
      { id: 'D1',
        do: '🗑️ Clear any cart. Leave any form without saving. Confirm no sale was completed.',
        expect: 'Empty cart, nothing written',
        why: 'This sheet writes nothing by design — this step is what makes that true rather than intended.' },
    ]},
  ],

  closing: [
    '<b>Remember the marks are inverted on sections A and B.</b> PASS = the problem is gone. FAIL = still exactly as described. A sheet full of FAILs here is a good outcome — it means the list is accurate.',
    '<b>Not on this sheet, and it is the real gap:</b> nothing has ever completed a sale on this build. Every test all week stops at the payment button, deliberately, because a completed transaction is a line in the shop\'s books. That means <b>Layla\'s shift would be the first real sale this code has ever rung.</b> If you want, we can ring one controlled sale on prod and refund it immediately — there are scripts that do exactly that and they are gated behind a flag. <b>Your call, and worth making before the shift rather than during it.</b>',
    'Everything in sections 4 and 5 of <span class="mono">onboarding/WHERE-WE-ARE.html</span> is deliberately not here: Settings\' keypad (your call, admin work), the kiosk welcome-percentage (Felix\'s call, moves money), and the housekeeping items. None of them stops a cashier ringing a sale.',
  ],
};</script>

<style>

  *{box-sizing:border-box}

       font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif; font-size:16px; line-height:1.55}
  .wrap{max-width:960px; margin:0 auto; padding:0 20px 100px}
  h1,h2{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; text-wrap:balance; margin:0}

  /* who ran it */
  .who{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; align-items:center}

<noscript><p style="padding:20px;color:#a51b1b">This sheet needs JavaScript — it records your marks as you go.</p></noscript>

<script>
(function () {
  var S = SHEET, state = {}, started = null, tick = null;
  var steps = [];
  S.sections.forEach(function (sec) { sec.steps.forEach(function (st) { steps.push(st); }); });

  function load() { try { var v = JSON.parse(localStorage.getItem(S.key) || '{}'); state = v.marks || {}; started = v.started || null;
                          if (v.who) { $('who-name').value = v.who.name || ''; $('who-where').value = v.who.where || ''; } } catch (e) {} }
  function save() { try { localStorage.setItem(S.key, JSON.stringify({
                          marks: state, started: started,
                          who: { name: $('who-name').value, where: $('who-where').value } })); } catch (e) {} }
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s); }
  function hhmmss(ms) { var t = Math.max(0, Math.round(ms / 1000));
    return (t / 3600 | 0 ? (t / 3600 | 0) + 'h ' : '') + ((t % 3600) / 60 | 0) + 'm ' + (t % 60) + 's'; }

  // ── render the sheet from SHEET ────────────────────────────────────────────────────────
  $('eyebrow').textContent = S.eyebrow;
  $('title').textContent = S.title;
  $('standfirst').innerHTML = S.standfirst;
  $('total').textContent = steps.length;
  $('meta').innerHTML = S.meta.map(function (m) {
    return '<span><b>' + esc(m[0]) + '</b> ' + (m[2] ? '<a href="' + m[2] + '">' + esc(m[1]) + '</a>' : esc(m[1])) + '</span>';
  }).join('');
  $('safety-t').textContent = S.safety.title;
  $('safety-b').innerHTML = S.safety.body;
  $('closing').innerHTML = (S.closing || []).map(function (c) { return '<li>' + c + '</li>'; }).join('');

  $('sheet').innerHTML = S.sections.map(function (sec) {
    return '<section><div class="sec-head"><div class="sec-letter">' + esc(sec.id) + '</div>' +
      '<h2>' + esc(sec.title) + '</h2><div class="sec-time">' + esc(sec.time || '') + '</div></div>' +
      sec.steps.map(function (st) {
        var codes = (st.codes || []).map(function (c) {
          return '<span class="ean" role="button" tabindex="0">' + esc(c) + '</span>'; }).join('');
        return '<div class="step" data-id="' + esc(st.id) + '">' +
          '<div class="step-top">' +
            '<div class="sid">' + esc(st.id) + '</div>' +
            '<div>' +
              '<p class="do">' + st.do + '</p>' +
              (codes ? '<div class="codes">' + codes + '</div>' : '') +
              (st.expect ? '<p class="expect js-expect">' + st.expect + '</p>' +
                           '<p class="hidden-expect js-hidden" style="display:none">' +
                           '<button type="button" class="js-reveal">Show what should happen ›</button></p>' : '') +
              (st.why ? '<p class="why">' + st.why + '</p>' : '') +
              (st.callout ? '<div class="callout">' + st.callout + '</div>' : '') +
            '</div>' +
            '<div><div class="marks">' +
              '<button class="mark" data-m="pass">PASS</button>' +
              '<button class="mark" data-m="issue">ISSUE</button>' +
              '<button class="mark" data-m="fail">FAIL</button>' +
            '</div><div class="stamp js-stamp"></div></div>' +
          '</div>' +
          '<div class="say"><label>Notes — what you saw, what confused you</label>' +
          '<textarea rows="1" placeholder="optional on a pass, please fill in on an issue or a fail"></textarea></div>' +
        '</div>';
      }).join('') + '</section>';
  }).join('');

  // ── behaviour ──────────────────────────────────────────────────────────────────────────
  function startClock() {
    if (!started) { started = Date.now(); save(); }
    if (!tick) tick = setInterval(paintClock, 1000);
    paintClock();
  }
  function paintClock() {
    if (!started) { $('clock').textContent = '—'; return; }
    var doneAll = steps.every(function (s) { return (state[s.id] || {}).v; });
    var end = doneAll ? lastStamp() : Date.now();
    $('clock').textContent = '⏱ ' + hhmmss(end - started) + (doneAll ? '' : '…');
    if (doneAll && tick) { clearInterval(tick); tick = null; }
  }
  function lastStamp() {
    return steps.reduce(function (m, s) { return Math.max(m, (state[s.id] || {}).at || 0); }, started || 0);
  }

  function paint() {
    var np = 0, ni = 0, nf = 0;
    document.querySelectorAll('.step').forEach(function (el) {
      var st = state[el.dataset.id] || {};
      if (st.v) el.dataset.v = st.v; else el.removeAttribute('data-v');
      if (st.v === 'pass') np++; if (st.v === 'issue') ni++; if (st.v === 'fail') nf++;
      var ta = el.querySelector('textarea');
      if (ta && ta.value !== (st.note || '')) ta.value = st.note || '';
      var stamp = el.querySelector('.js-stamp');
      stamp.textContent = st.at ? new Date(st.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
    });
    var n = steps.length, done = np + ni + nf;
    $('done').textContent = done; $('np').textContent = np; $('ni').textContent = ni; $('nf').textContent = nf;
    $('bp').style.width = (np / n * 100) + '%';
    $('bi').style.width = (ni / n * 100) + '%';
    $('bf').style.width = (nf / n * 100) + '%';
    var v = $('verdict'); v.className = 'verdict';
    if (nf) { v.classList.add('nogo'); v.textContent = 'No go'; }
    else if (done === n && ni) { v.classList.add('issues'); v.textContent = 'Go with issues'; }
    else if (done === n) { v.classList.add('go'); v.textContent = 'Go'; }
    else if (!done) { v.textContent = 'Not started'; }
    else { v.textContent = (n - done) + ' left'; }
    paintClock();
    $('sum').textContent = report();
  }

  function report() {
    var np = 0, ni = 0, nf = 0, rows = [];
    steps.forEach(function (s) {
      var st = state[s.id] || {};
      if (!st.v && !st.note) return;
      if (st.v === 'pass') np++; if (st.v === 'issue') ni++; if (st.v === 'fail') nf++;
      rows.push('  ' + (s.id + '    ').slice(0, 5) + (st.v ? st.v.toUpperCase() : '—').padEnd(6) +
                (st.note ? '· ' + st.note.replace(/\s+/g, ' ') : ''));
    });
    if (!rows.length) return 'Nothing marked yet.';
    var who = $('who-name').value.trim(), where = $('who-where').value.trim();
    var done = np + ni + nf;
    var head = [
      S.title,
      'build ' + (S.meta.find(function (m) { return m[0] === 'Build'; }) || [])[1],
      who ? 'tested by ' + who : null,
      where ? 'on ' + where : null,
      started ? new Date(started).toLocaleString() : null,
      // Elapsed, not first-mark-to-last-mark: a half-finished run was reporting "took 0m 0s"
      // because only one step had a timestamp. A finished run freezes at the last mark.
      started ? (done === steps.length ? 'took ' : 'running ') + hhmmss((done === steps.length ? lastStamp() : Date.now()) - started) : null,
    ].filter(Boolean).join(' · ');
    var verdict = nf ? 'NO GO' : (done === steps.length ? (ni ? 'GO WITH ISSUES' : 'GO') : 'INCOMPLETE');
    return head + '\n' + '-'.repeat(Math.min(head.length, 72)) + '\n' + rows.join('\n') +
      '\n\n' + np + ' pass · ' + ni + ' issue · ' + nf + ' fail · ' +
      (steps.length - done) + ' not run\nVERDICT: ' + verdict;
  }

  document.querySelectorAll('.step').forEach(function (el) {
    var id = el.dataset.id;
    el.querySelectorAll('.mark').forEach(function (b) {
      b.addEventListener('click', function () {
        startClock();
        state[id] = state[id] || {};
        if (state[id].v === b.dataset.m) { state[id].v = null; state[id].at = null; }
        else { state[id].v = b.dataset.m; state[id].at = Date.now(); }
        save(); paint();
      });
    });
    var ta = el.querySelector('textarea');
    ta.addEventListener('input', function () {
      state[id] = state[id] || {}; state[id].note = ta.value;
      ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 220) + 'px';
      save(); $('sum').textContent = report();
    });
    var rev = el.querySelector('.js-reveal');
    if (rev) rev.addEventListener('click', function () {
      el.querySelector('.js-expect').style.display = '';
      el.querySelector('.js-hidden').style.display = 'none';
    });
  });

  // Training mode: the tester says what they saw BEFORE reading what they were told to see.
  // A sheet that shows the answer first is a checklist; one that does not is a lesson.
  $('training').addEventListener('change', function () {
    var on = $('training').checked;
    document.querySelectorAll('.step').forEach(function (el) {
      var e = el.querySelector('.js-expect'), h = el.querySelector('.js-hidden');
      if (!e || !h) return;
      e.style.display = on ? 'none' : '';
      h.style.display = on ? '' : 'none';
    });
  });

  ['who-name', 'who-where'].forEach(function (id) {
    $(id).addEventListener('input', function () { save(); $('sum').textContent = report(); });
  });

  $('reset').addEventListener('click', function () {
    state = {}; started = null; if (tick) { clearInterval(tick); tick = null; }
    save(); paint();
  });

  $('copy').addEventListener('click', function () {
    var txt = report(), done = function () {
      $('said').textContent = 'copied'; setTimeout(function () { $('said').textContent = ''; }, 1400); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback);
    else fallback();
    function fallback() {
      var t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); done(); } catch (e) { $('said').textContent = 'select the text below and copy'; }
      document.body.removeChild(t);
    }
  });
  $('print').addEventListener('click', function () { window.print(); });

  document.querySelectorAll('.ean').forEach(function (el) {
    function copy() {
      var txt = el.textContent.trim(), ok = function () {
        el.classList.add('copied'); setTimeout(function () { el.classList.remove('copied'); }, 900); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, function () {});
      else { var t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select();
             try { document.execCommand('copy'); ok(); } catch (e) {} document.body.removeChild(t); }
    }
    el.addEventListener('click', copy);
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); copy(); } });
  });

  load(); paint();
  if (started) { tick = setInterval(paintClock, 1000); paintClock(); }
})();
</script>
